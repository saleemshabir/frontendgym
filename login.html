<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IRONCORE — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --black:#080808;--dark:#111;--dark2:#1a1a1a;--dark3:#222;
      --accent:#e8ff00;--accent2:#00d4ff;--white:#f0f0f0;
      --gray:#888;--gray2:#444;--danger:#ff1744;--success:#00e676;
    }
    body{
      font-family:'Barlow',sans-serif;
      background:var(--black);
      color:var(--white);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      position:relative;
    }

    /* Animated background grid */
    body::before{
      content:'';
      position:fixed;inset:0;
      background-image:
        linear-gradient(rgba(232,255,0,0.03) 1px,transparent 1px),
        linear-gradient(90deg,rgba(232,255,0,0.03) 1px,transparent 1px);
      background-size:60px 60px;
      animation:gridMove 20s linear infinite;
      pointer-events:none;
    }
    @keyframes gridMove{from{background-position:0 0}to{background-position:60px 60px}}

    /* Glowing orbs */
    .orb{
      position:fixed;border-radius:50%;filter:blur(80px);
      pointer-events:none;animation:pulse 6s ease-in-out infinite;
    }
    .orb1{width:400px;height:400px;background:rgba(232,255,0,0.06);top:-100px;left:-100px;}
    .orb2{width:300px;height:300px;background:rgba(0,212,255,0.06);bottom:-80px;right:-80px;animation-delay:3s;}
    @keyframes pulse{0%,100%{opacity:0.5;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}

    .login-wrap{
      position:relative;z-index:10;
      width:100%;max-width:440px;
      padding:20px;
    }

    /* Logo */
    .logo-block{text-align:center;margin-bottom:36px;}
    .logo-icon{font-size:48px;display:block;margin-bottom:8px;}
    .logo-name{
      font-family:'Barlow Condensed',sans-serif;
      font-size:42px;font-weight:900;
      letter-spacing:6px;color:var(--white);
      text-transform:uppercase;line-height:1;
    }
    .logo-tag{
      font-size:11px;font-weight:600;
      letter-spacing:4px;color:var(--accent);
      text-transform:uppercase;margin-top:4px;
    }

    /* Card */
    .card{
      background:var(--dark2);
      border:1px solid var(--dark3);
      border-radius:6px;
      overflow:hidden;
      box-shadow:0 24px 80px rgba(0,0,0,0.6);
    }

    /* Tabs */
    .tabs{display:flex;border-bottom:1px solid var(--dark3);}
    .tab{
      flex:1;padding:16px;text-align:center;
      font-family:'Barlow Condensed',sans-serif;
      font-size:13px;font-weight:700;
      letter-spacing:2px;text-transform:uppercase;
      color:var(--gray);cursor:pointer;
      border-bottom:2px solid transparent;
      transition:all 0.2s;background:none;border-left:none;border-right:none;border-top:none;
    }
    .tab.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(232,255,0,0.04);}
    .tab:hover:not(.active){color:var(--white);background:rgba(255,255,255,0.02);}

    /* Form */
    .form-body{padding:28px 28px 24px;}
    .form-panel{display:none;}
    .form-panel.active{display:block;}

    .form-title{
      font-family:'Barlow Condensed',sans-serif;
      font-size:22px;font-weight:800;
      letter-spacing:2px;text-transform:uppercase;
      margin-bottom:4px;
    }
    .form-sub{font-size:13px;color:var(--gray);margin-bottom:24px;}

    .form-group{margin-bottom:16px;}
    .form-group label{
      display:block;
      font-size:10px;font-weight:700;
      letter-spacing:2px;text-transform:uppercase;
      color:var(--gray);margin-bottom:6px;
    }
    .form-group input, .form-group select{
      width:100%;
      background:var(--dark);
      border:1px solid var(--dark3);
      border-radius:4px;
      padding:11px 14px;
      color:var(--white);
      font-family:'Barlow',sans-serif;
      font-size:14px;
      transition:border-color 0.2s,box-shadow 0.2s;
    }
    .form-group input:focus, .form-group select:focus{
      outline:none;
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(232,255,0,0.08);
    }
    .form-group select option{background:var(--dark2);}

    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

    .btn-login{
      width:100%;
      padding:13px;
      background:var(--accent);
      color:var(--black);
      border:none;
      border-radius:4px;
      font-family:'Barlow Condensed',sans-serif;
      font-size:15px;font-weight:800;
      letter-spacing:2px;text-transform:uppercase;
      cursor:pointer;
      transition:all 0.2s;
      margin-top:8px;
    }
    .btn-login:hover{background:#d4eb00;transform:translateY(-1px);box-shadow:0 4px 20px rgba(232,255,0,0.2);}
    .btn-login:active{transform:translateY(0);}
    .btn-login:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

    .error-msg{
      background:rgba(255,23,68,0.1);
      border:1px solid rgba(255,23,68,0.3);
      border-radius:4px;
      padding:10px 14px;
      font-size:13px;color:var(--danger);
      margin-bottom:16px;
      display:none;
    }
    .error-msg.show{display:block;}
    .success-msg{
      background:rgba(0,230,118,0.1);
      border:1px solid rgba(0,230,118,0.3);
      border-radius:4px;
      padding:10px 14px;
      font-size:13px;color:var(--success);
      margin-bottom:16px;
      display:none;
    }
    .success-msg.show{display:block;}

    /* Demo credentials box */
    .demo-box{
      margin:0 28px 24px;
      background:rgba(0,212,255,0.05);
      border:1px solid rgba(0,212,255,0.2);
      border-radius:4px;
      padding:14px 16px;
    }
    .demo-box-title{
      font-size:10px;font-weight:700;
      letter-spacing:2px;color:var(--accent2);
      text-transform:uppercase;margin-bottom:10px;
    }
    .demo-creds{display:flex;gap:12px;flex-wrap:wrap;}
    .demo-item{
      flex:1;min-width:130px;
      background:var(--dark);
      border:1px solid var(--dark3);
      border-radius:3px;
      padding:10px 12px;
      cursor:pointer;
      transition:border-color 0.2s;
    }
    .demo-item:hover{border-color:var(--accent2);}
    .demo-role{
      font-family:'Barlow Condensed',sans-serif;
      font-size:11px;font-weight:700;
      letter-spacing:2px;text-transform:uppercase;
      margin-bottom:4px;
    }
    .demo-role.admin{color:var(--accent);}
    .demo-role.user{color:var(--accent2);}
    .demo-detail{font-size:11px;color:var(--gray);line-height:1.6;}

    .footer-note{
      text-align:center;
      padding:16px 28px 20px;
      font-size:12px;color:var(--gray2);
      border-top:1px solid var(--dark3);
    }

    /* Spinner */
    .spinner-inline{
      display:inline-block;
      width:14px;height:14px;
      border:2px solid rgba(0,0,0,0.3);
      border-top-color:var(--black);
      border-radius:50%;
      animation:spin 0.6s linear infinite;
      vertical-align:middle;margin-right:6px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="login-wrap">
    <div class="logo-block">
      <span class="logo-icon">🏋️</span>
      <div class="logo-name">IRONCORE</div>
      <div class="logo-tag">Gym Management System</div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Sign In</button>
        <button class="tab" onclick="switchTab('register')">Register</button>
      </div>

      <!-- LOGIN FORM -->
      <div class="form-panel active" id="panel-login">
        <div class="form-body">
          <div class="form-title">Welcome Back</div>
          <div class="form-sub">Sign in to your account to continue</div>
          <div class="error-msg" id="login-error"></div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email"/>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password"/>
          </div>
          <button class="btn-login" id="login-btn" onclick="doLogin()">Sign In</button>
        </div>
      </div>

      <!-- REGISTER FORM -->
      <div class="form-panel" id="panel-register">
        <div class="form-body">
          <div class="form-title">Create Account</div>
          <div class="form-sub">Register as a gym member</div>
          <div class="error-msg" id="reg-error"></div>
          <div class="success-msg" id="reg-success"></div>
          <div class="form-row">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="reg-name" placeholder="Your name"/>
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" id="reg-phone" placeholder="+91 XXXXX"/>
            </div>
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="reg-email" placeholder="you@example.com"/>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="reg-password" placeholder="Minimum 6 characters"/>
          </div>
          <div class="form-group">
            <label>Account Type</label>
            <select id="reg-role">
              <option value="user">Member (User)</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <button class="btn-login" id="reg-btn" onclick="doRegister()">Create Account</button>
        </div>
      </div>

      <!-- DEMO CREDENTIALS -->
      <div class="demo-box">
        <div class="demo-box-title">⚡ Quick Demo — Click to fill</div>
        <div class="demo-creds">
          <div class="demo-item" onclick="fillDemo('admin@ironcore.com','admin123')">
            <div class="demo-role admin">🔑 Admin</div>
            <div class="demo-detail">admin@ironcore.com<br/>admin123</div>
          </div>
          <div class="demo-item" onclick="fillDemo('user@ironcore.com','user123')">
            <div class="demo-role user">👤 Member</div>
            <div class="demo-detail">user@ironcore.com<br/>user123</div>
          </div>
        </div>
      </div>

      <div class="footer-note">
        First time? Run <code style="color:#e8ff00">POST /api/auth/seed</code> to create demo accounts
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000/api';

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
    }

    function fillDemo(email, pass) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pass;
      // switch to login tab if not already
      document.querySelectorAll('.tab')[0].click();
    }

    async function doLogin() {
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn      = document.getElementById('login-btn');
      const errEl    = document.getElementById('login-error');
      errEl.classList.remove('show');

      if (!email || !password) {
        errEl.textContent = 'Please enter email and password.';
        errEl.classList.add('show'); return;
      }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-inline"></span>Signing in...';

      try {
        const res  = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('gym_token', data.token);
          localStorage.setItem('gym_user',  JSON.stringify(data.user));
          btn.innerHTML = '✅ Redirecting...';
          setTimeout(() => {
            window.location.href = data.user.role === 'admin' ? '/admin' : '/dashboard';
          }, 600);
        } else {
          errEl.textContent = data.message;
          errEl.classList.add('show');
          btn.disabled = false;
          btn.innerHTML = 'Sign In';
        }
      } catch (e) {
        errEl.textContent = 'Cannot connect to server. Is it running?';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    }

    async function doRegister() {
      const name     = document.getElementById('reg-name').value.trim();
      const email    = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const phone    = document.getElementById('reg-phone').value.trim();
      const role     = document.getElementById('reg-role').value;
      const btn      = document.getElementById('reg-btn');
      const errEl    = document.getElementById('reg-error');
      const sucEl    = document.getElementById('reg-success');
      errEl.classList.remove('show'); sucEl.classList.remove('show');

      if (!name || !email || !password) {
        errEl.textContent = 'Name, email and password are required.';
        errEl.classList.add('show'); return;
      }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-inline"></span>Creating account...';

      try {
        const res  = await fetch(`${API}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, phone, role })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('gym_token', data.token);
          localStorage.setItem('gym_user',  JSON.stringify(data.user));
          sucEl.textContent = data.message + ' Redirecting...';
          sucEl.classList.add('show');
          setTimeout(() => {
            window.location.href = data.user.role === 'admin' ? '/admin' : '/dashboard';
          }, 1000);
        } else {
          errEl.textContent = data.message;
          errEl.classList.add('show');
        }
      } catch (e) {
        errEl.textContent = 'Cannot connect to server.';
        errEl.classList.add('show');
      }
      btn.disabled = false;
      btn.innerHTML = 'Create Account';
    }

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const loginPanel = document.getElementById('panel-login');
        if (loginPanel.classList.contains('active')) doLogin();
        else doRegister();
      }
    });

    // Auto seed on load (creates demo accounts if not existing)
    fetch(`${API}/auth/seed`, { method: 'POST' }).catch(() => {});

    // Redirect if already logged in
    const token = localStorage.getItem('gym_token');
    const user  = localStorage.getItem('gym_user');
    if (token && user) {
      const u = JSON.parse(user);
      window.location.href = u.role === 'admin' ? '/admin' : '/dashboard';
    }
  </script>
</body>
</html>
